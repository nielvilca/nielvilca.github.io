<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camión, Corazón y Balones Yo-Yo</title>
  <!-- Se carga la fuente para el texto -->
  <link href="https://fonts.googleapis.com/css?family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    /* Reset básico */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fef9f0;
    }

    /* Fondo: Contenedor para los yo-yos (balones) */
    .background-balls {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    /* Cada contenedor de balón (yo-yo) anclado a la parte superior */
    .ball-wrapper {
      position: absolute;
      top: 0;
      /* La posición horizontal, ancho y alto se definirán individualmente */
    }
    /* "Cuerda" que une la parte superior con el balón */
    .ball-wrapper .string {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      background: #999;
      height: 0; /* Se animará para simular el despliegue de la cuerda */
    }
    /* Estilo del balón */
    .ball-wrapper .ball {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #333;
      background: radial-gradient(circle, #fff 30%, #e0e0e0 70%);
    }
    /* Animación para el balón (movimiento tipo yo-yo) */
    @keyframes yoYoBall {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(120px); }
    }
    /* Animación para la cuerda: se alarga conforme baja el balón */
    @keyframes yoYoString {
      0%, 100% { height: 0; }
      50% { height: 120px; }
    }

    /* Configuración individual para cada ball-wrapper (posición, tamaño y demora) */
    .background-balls .ball-wrapper:nth-child(1) {
      left: 8%;
      width: 40px;
      height: 40px;
    }
    .background-balls .ball-wrapper:nth-child(1) .ball {
      animation: yoYoBall 2s infinite ease-in-out;
      animation-delay: 0s;
    }
    .background-balls .ball-wrapper:nth-child(1) .string {
      animation: yoYoString 2s infinite ease-in-out;
      animation-delay: 0s;
    }

    .background-balls .ball-wrapper:nth-child(2) {
      left: 20%;
      width: 45px;
      height: 45px;
    }
    .background-balls .ball-wrapper:nth-child(2) .ball {
      animation: yoYoBall 2s infinite ease-in-out;
      animation-delay: 0.3s;
    }
    .background-balls .ball-wrapper:nth-child(2) .string {
      animation: yoYoString 2s infinite ease-in-out;
      animation-delay: 0.3s;
    }

    .background-balls .ball-wrapper:nth-child(3) {
      left: 32%;
      width: 50px;
      height: 50px;
    }
    .background-balls .ball-wrapper:nth-child(3) .ball {
      animation: yoYoBall 2s infinite ease-in-out;
      animation-delay: 0.6s;
    }
    .background-balls .ball-wrapper:nth-child(3) .string {
      animation: yoYoString 2s infinite ease-in-out;
      animation-delay: 0.6s;
    }

    .background-balls .ball-wrapper:nth-child(4) {
      left: 44%;
      width: 40px;
      height: 40px;
    }
    .background-balls .ball-wrapper:nth-child(4) .ball {
      animation: yoYoBall 2s infinite ease-in-out;
      animation-delay: 0.9s;
    }
    .background-balls .ball-wrapper:nth-child(4) .string {
      animation: yoYoString 2s infinite ease-in-out;
      animation-delay: 0.9s;
    }

    .background-balls .ball-wrapper:nth-child(5) {
      left: 56%;
      width: 50px;
      height: 50px;
    }
    .background-balls .ball-wrapper:nth-child(5) .ball {
      animation: yoYoBall 2s infinite ease-in-out;
      animation-delay: 1.2s;
    }
    .background-balls .ball-wrapper:nth-child(5) .string {
      animation: yoYoString 2s infinite ease-in-out;
      animation-delay: 1.2s;
    }

    .background-balls .ball-wrapper:nth-child(6) {
      left: 68%;
      width: 45px;
      height: 45px;
    }
    .background-balls .ball-wrapper:nth-child(6) .ball {
      animation: yoYoBall 2s infinite ease-in-out;
      animation-delay: 1.5s;
    }
    .background-balls .ball-wrapper:nth-child(6) .string {
      animation: yoYoString 2s infinite ease-in-out;
      animation-delay: 1.5s;
    }

    .background-balls .ball-wrapper:nth-child(7) {
      left: 80%;
      width: 40px;
      height: 40px;
    }
    .background-balls .ball-wrapper:nth-child(7) .ball {
      animation: yoYoBall 2s infinite ease-in-out;
      animation-delay: 1.8s;
    }
    .background-balls .ball-wrapper:nth-child(7) .string {
      animation: yoYoString 2s infinite ease-in-out;
      animation-delay: 1.8s;
    }

    .background-balls .ball-wrapper:nth-child(8) {
      left: 92%;
      width: 50px;
      height: 50px;
    }
    .background-balls .ball-wrapper:nth-child(8) .ball {
      animation: yoYoBall 2s infinite ease-in-out;
      animation-delay: 2.1s;
    }
    .background-balls .ball-wrapper:nth-child(8) .string {
      animation: yoYoString 2s infinite ease-in-out;
      animation-delay: 2.1s;
    }

    /* Escena principal (sobre el fondo) */
    .scene {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
    }
    /* Camión animado */
    .truck {
      position: absolute;
      bottom: 20px;
      left: -200px;
      width: 150px;
      height: 80px;
      animation: truckPass 5s linear forwards;
    }
    .truck div {
      position: absolute;
    }
    .truck-body {
      top: 0;
      left: 0;
      width: 100%;
      height: 50px;
      background: #ff6347;
      border-radius: 5px;
    }
    .truck-cabin {
      top: -20px;
      left: 100px;
      width: 50px;
      height: 40px;
      background: #ff4500;
      border-radius: 5px;
    }
    .truck-wheel {
      bottom: -15px;
      width: 30px;
      height: 30px;
      background: #333;
      border-radius: 50%;
    }
    .wheel1 { left: 20px; }
    .wheel2 { right: 20px; }
    @keyframes truckPass {
      from { left: -200px; }
      to { left: 100%; }
    }

    /* Corazón y texto en primer plano */
    .heart-container {
      position: absolute;
      left: 50%;
      top: 30%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 3;
    }
    .heart {
      font-size: 50px;
      color: #e91e63;
      transform: scale(0);
      opacity: 0;
      animation: heartPop 1s ease-out forwards;
      animation-delay: 3s;
    }
    @keyframes heartPop {
      0% {
        transform: scale(0);
        opacity: 0;
      }
      50% {
        transform: scale(1.2);
        opacity: 1;
      }
      100% {
        transform: scale(1);
        opacity: 1;
      }
    }
    .heart-container h3 {
      margin-top: 10px;
      font-family: 'Great Vibes', cursive;
      font-size: 3em;
      color: #d63384;
      transition: transform 0.3s ease;
    }
    .heart-container h3:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>
  <!-- Fondo: Cada yo-yo (balón con cuerda) con una letra -->
  <div class="background-balls">
    <div class="ball-wrapper"><div class="string"></div><div class="ball">M</div></div>
    <div class="ball-wrapper"><div class="string"></div><div class="ball">e</div></div>
    <div class="ball-wrapper"><div class="string"></div><div class="ball">l</div></div>
    <div class="ball-wrapper"><div class="string"></div><div class="ball">a</div></div>
    <div class="ball-wrapper"><div class="string"></div><div class="ball">n</div></div>
    <div class="ball-wrapper"><div class="string"></div><div class="ball">n</div></div>
    <div class="ball-wrapper"><div class="string"></div><div class="ball">i</div></div>
    <div class="ball-wrapper"><div class="string"></div><div class="ball">e</div></div>
  </div>
  
  <div class="scene">
    <!-- Camión animado -->
    <div class="truck">
      <div class="truck-body"></div>
      <div class="truck-cabin"></div>
      <div class="truck-wheel wheel1"></div>
      <div class="truck-wheel wheel2"></div>
    </div>
    
    <!-- Contenedor para el corazón y el texto "Melannie" -->
    <div class="heart-container">
      <div class="heart">❤</div>
      <h3>Melannie</h3>
    </div>
  </div>
</body>
</html>
